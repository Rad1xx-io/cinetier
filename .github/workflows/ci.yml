name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it is aimed at. Restricted to main, this
  # skipped any pull request stacked on another branch — which is exactly the
  # kind that most wants checking, since it is built on code that is not
  # settled yet. One such pull request went through review and merged without a
  # single check having run, and nothing said so.
  #
  # `push` stays pinned to main on purpose: a branch with an open pull request
  # would otherwise be verified twice for every commit.
  pull_request:

# A branch that gets two pushes in a minute should not run twice. The in-flight
# run is cancelled, except on main, where every commit deserves its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Matches the version this app is developed on. Node 20 is past its
      # end-of-life, so it is not the fallback it used to be; Next 16 itself
      # requires 20.9 or newer.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm

      # `ci`, not `install`: it installs exactly what package-lock.json pins and
      # fails if the two have drifted, which is the point of running it here.
      - run: npm ci

      # Each step runs even when an earlier one failed, so a red build reports
      # everything that is wrong in one go rather than one problem per push.
      #
      # `typecheck` runs `next typegen` first. PageProps and LayoutProps are
      # generated into .next/types, which a fresh checkout does not have — the
      # first run of this workflow failed on exactly that, with fourteen
      # "Cannot find name" errors that never appear locally because .next is
      # already there. The generation lives in the script rather than here, so a
      # fresh clone typechecks for a person too.
      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Test
        if: '!cancelled()'
        run: npm test

  # Kept separate from the unit job so a browser download never delays the
  # verdict on typing, linting and the suite — and so a failure here names
  # itself rather than hiding inside a longer run.
  browser:
    name: Browser test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      # Only chromium. The suite here is one page rendered one way, and the
      # other two engines would triple the download for nothing.
      - run: npx playwright install --with-deps chromium

      # Builds and serves the app itself; every request it makes to Supabase is
      # intercepted in the test, so this needs no database and no secrets.
      - run: npm run test:e2e
