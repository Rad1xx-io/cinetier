<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TierListOnline">
  <!-- Podium in the site's own accent gold (globals.css accent token), replacing
       the tier-row version: short/tall/short reads as ranking even at 16px,
       where three same-width tier bars start to look like a generic sort icon. -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <rect x="12" y="34" width="12" height="18" rx="2.5" fill="#e8b34c"/>
  <rect x="26" y="18" width="12" height="34" rx="2.5" fill="#e8b34c"/>
  <rect x="40" y="27" width="12" height="25" rx="2.5" fill="#e8b34c"/>
</svg>
